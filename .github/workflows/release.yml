name: Deploy Toonflow App

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: 'Branch or tag to deploy'
        required: true
        default: 'develop'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_ref }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} "echo connected"

      - name: Deploy on ECS
        run: |
          ssh ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} << EOF
            set -e
            cd /opt/metis/Toonflow-app
            git fetch --all
            git checkout ${{ github.event.inputs.deploy_ref }}
            git pull origin ${{ github.event.inputs.deploy_ref }}
            docker compose -f docker-compose.persist.yml up -d --build
          EOF