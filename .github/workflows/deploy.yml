name: Deploy Toonflow App

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: 'Branch or tag to deploy'
        required: true
        default: 'develop'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_ref }}

      - name: Setup SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/id_ed25519 <<'EOF'
          ${{ secrets.ECS_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts

      - name: Validate secrets
        shell: bash
        run: |
          test -n "${{ secrets.ECS_HOST }}" || (echo "ECS_HOST is empty" && exit 1)
          test -n "${{ secrets.ECS_USER }}" || (echo "ECS_USER is empty" && exit 1)
          test -n "${{ secrets.ECS_SSH_KEY }}" || (echo "ECS_SSH_KEY is empty" && exit 1)
          echo "ECS_HOST is set"
          echo "ECS_USER is set"

      - name: Test SSH connection
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" "echo connected"

      - name: Deploy on ECS
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" << EOF
            set -e
            cd /opt/metis/Toonflow-app
            git fetch --all
            git checkout ${{ github.event.inputs.deploy_ref }}
            git pull origin ${{ github.event.inputs.deploy_ref }}
            docker compose -f docker-compose.persist.yml up -d --build
          EOF
